name: android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The runner image already ships cmdline-tools. Installing the deprecated
      # `tools` package through android-actions/setup-android now fails, so the
      # SDK is configured directly instead.
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "$SDKM" ]; then
            SDKM="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | head -1)"
          fi
          echo "Using $SDKM"
          yes | "$SDKM" --licenses >/dev/null 2>&1 || true
          "$SDKM" --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools" \
            "ndk;27.0.12077973" \
            "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Android build and unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Host DSP tests
        run: |
          cmake -S host -B build-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-host -j
          ./build-host/engine_tests
          ./build-host/tone_sweep
          ./build-host/firmware_synthetic_test

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: replicant-tr8s-android-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
